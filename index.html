
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <title>OmniCalc Pro | Modern Intelligence</title>
    <meta name="description" content="Next-generation computation platform for finance, health, and science." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              accent: 'var(--accent-color)',
              brand: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: 'var(--accent-color)',
                600: 'var(--accent-color-dark)',
                700: '#4338ca',
                800: '#3730a3',
                900: '#312e81',
              },
              dark: {
                bg: 'var(--bg-primary)',
                surface: 'var(--bg-secondary)',
                border: 'var(--border-color)'
              }
            },
            borderRadius: {
              'xl': 'var(--radius-xl)',
              '2xl': 'var(--radius-2xl)',
              '3xl': 'var(--radius-3xl)',
            },
            animation: {
              'fade-up': 'fade-up 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
              'blur-in': 'blur-in 0.4s ease-out forwards',
              'float': 'float 6s ease-in-out infinite',
              'slide-in': 'slide-in 0.3s ease-out',
            },
            keyframes: {
              'fade-up': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'blur-in': {
                '0%': { filter: 'blur(8px)', opacity: '0' },
                '100%': { filter: 'blur(0)', opacity: '1' },
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-12px)' },
              },
              'slide-in': {
                '0%': { transform: 'translateX(100%)' },
                '100%': { transform: 'translateX(0)' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
        
        /* Defaults: Indigo Dark */
        --accent-color: #6366f1;
        --accent-color-dark: #4f46e5;
        --accent-glow: rgba(99, 102, 241, 0.15);
        
        --bg-primary: #020617;
        --bg-secondary: #0f172a;
        --border-color: rgba(255, 255, 255, 0.08);
        
        --radius-xl: 1rem;
        --radius-2xl: 1.5rem;
        --radius-3xl: 2rem;
        
        --glass-blur: 24px;
        --glass-bg: rgba(255, 255, 255, 0.03);
      }
      
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        -webkit-font-smoothing: antialiased;
        background-color: var(--bg-primary);
        color: #f8fafc;
        transition: background-color 0.3s ease;
      }
      
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      /* Glassmorphism Classes */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        border: 1px solid var(--border-color);
      }
      .glass-heavy {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(32px);
        border: 1px solid var(--border-color);
      }
      
      /* Mesh Background */
      .bg-mesh {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: radial-gradient(circle at 0% 0%, var(--accent-glow) 0%, transparent 40%),
                    radial-gradient(circle at 100% 100%, rgba(244, 63, 94, 0.05) 0%, transparent 40%);
        filter: blur(80px);
      }

      /* Hide scrollbar */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Custom Range Input */
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        background: var(--accent-color);
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid white;
        box-shadow: 0 0 10px var(--accent-glow);
      }

      /* Custom Accent Styles */
      .text-accent { color: var(--accent-color); }
      .bg-accent { background-color: var(--accent-color); }
      .border-accent { border-color: var(--accent-color); }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom": "https://esm.sh/react-dom@^19.2.4",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.4/client",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
  </head>
  <body class="selection:bg-indigo-500/30">
    <div class="bg-mesh"></div>
    <div id="root"></div>
  </body>
</html>
